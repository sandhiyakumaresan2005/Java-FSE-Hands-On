# API Gateway Configuration
spring.application.name=api-gateway

# Port on which API Gateway runs
server.port=9090

# Eureka Server URL where this service will register itself
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Enable dynamic routing based on service registry
# This allows gateway to auto-discover services from Eureka
spring.cloud.gateway.discovery.locator.enabled=true

# Convert service names to lowercase for URL routing
# E.g., service name "greet-service" becomes "greet-service" in URL
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
