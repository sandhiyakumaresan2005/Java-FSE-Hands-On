# Eureka Server Configuration
# Port on which Eureka Server runs
server.port=8761

# Prevents this server from registering itself with Eureka (it IS the Eureka server)
eureka.client.register-with-eureka=false

# Prevents fetching registry from other Eureka instances
eureka.client.fetch-registry=false

# Disable Netflix Eureka logs
logging.level.com.netflix.eureka=OFF
logging.level.com.netflix.discovery=OFF
